# Mesures systeme de la VM vers InfluxDB 3 (base "systeme"), comme l'exercice historique
[agent]
  interval = "10s"
  flush_interval = "10s"
  hostname = "vm-noc"

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8181"]
  token = "${INFLUX_TOKEN}"
  organization = ""
  bucket = "systeme"

[[inputs.cpu]]
  percpu = false
  totalcpu = true
[[inputs.mem]]
[[inputs.system]]
[[inputs.disk]]
  mount_points = ["/"]
[[inputs.net]]
  ignore_protocol_stats = true
