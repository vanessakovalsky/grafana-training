# Stack de la formation "Monitorer avec Grafana" (Orange) - fil rouge Telcea
# Une stack par VM stagiaire. Ports publies sur 127.0.0.1 uniquement :
# Grafana et Mailpit sont exposes par le Nginx de la VM (/grafana/, /mail/).
name: telcea

x-defaut: &defaut
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "2"}

services:
  grafana:
    <<: *defaut
    image: grafana/grafana:13.3.1
    ports: ["127.0.0.1:${GRAFANA_PORT:-3000}:3000"]
    environment:
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-formation}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: mailpit:1025
      GF_SMTP_FROM_ADDRESS: grafana@telcea.example
      GF_SMTP_FROM_NAME: Grafana Telcea
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning

  prometheus:
    <<: *defaut
    image: prom/prometheus:v3.16.0
    ports: ["127.0.0.1:9090:9090"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus

  alertmanager:
    <<: *defaut
    image: prom/alertmanager:v0.35.0
    ports: ["127.0.0.1:9093:9093"]
    volumes:
      - ./alertmanager:/etc/alertmanager:ro

  simulateur:
    <<: *defaut
    build: ./simulateur
    image: telcea-simulateur:1.0
    ports: ["127.0.0.1:9200:9200"]

  node-exporter:
    <<: *defaut
    image: prom/node-exporter:v1.12.1
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro

  cadvisor:
    <<: *defaut
    image: ghcr.io/google/cadvisor:v0.61.0
    privileged: true
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.service
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  influxdb:
    <<: *defaut
    image: influxdb:3.12.2-core
    ports: ["127.0.0.1:8181:8181"]
    command:
      - influxdb3
      - serve
      - --node-id=telcea
      - --object-store=file
      - --data-dir=/var/lib/influxdb3/data
      - --admin-token-file=/etc/influxdb3/admin-token.json
    volumes:
      - influxdb_data:/var/lib/influxdb3
      - ./influxdb/admin-token.json:/etc/influxdb3/admin-token.json:ro

  telegraf:
    <<: *defaut
    image: telegraf:1.40.3
    hostname: vm-noc
    environment:
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      HOST_PROC: /host/proc
      HOST_SYS: /host/sys
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    depends_on: [influxdb]

  loki:
    <<: *defaut
    image: grafana/loki:3.7.10
    ports: ["127.0.0.1:3100:3100"]
    volumes:
      - loki_data:/loki

  alloy:
    <<: *defaut
    image: grafana/alloy:v1.22.0
    command: [run, /etc/alloy/config.alloy, --storage.path=/var/lib/alloy/data]
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]

  mailpit:
    <<: *defaut
    image: axllent/mailpit:v1.34.0
    ports: ["127.0.0.1:8025:8025"]
    environment:
      MP_WEBROOT: mail

volumes:
  grafana_data:
  prometheus_data:
  influxdb_data:
  loki_data:
