# Prometheus de la VM stagiaire (formation Grafana Orange - fil rouge Telcea)
global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/regles/*.yml

scrape_configs:
  - job_name: telcea-reseau          # reseau telecom simule
    static_configs:
      - targets: ["simulateur:9200"]
  - job_name: node                   # la VM elle-meme
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: cadvisor               # conteneurs de la VM
    scrape_interval: 30s
    static_configs:
      - targets: ["cadvisor:8080"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
