<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340" font-family="sans-serif">
  <!-- Reseau Telcea : 3 regions reliees au coeur parisien (ids prefixes "cell-" pour Flow) -->
  <line id="cell-REN-PAR" x1="120" y1="170" x2="320" y2="170" stroke="#888" stroke-width="10"/>
  <line id="cell-LIL-PAR" x1="320" y1="60" x2="320" y2="170" stroke="#888" stroke-width="10"/>
  <line id="cell-MRS-PAR" x1="320" y1="170" x2="520" y2="280" stroke="#888" stroke-width="10"/>
  <rect id="cell-Bretagne" x="40" y="140" width="120" height="60" rx="10" fill="#444"/>
  <rect id="cell-Hauts-de-France" x="250" y="20" width="140" height="60" rx="10" fill="#444"/>
  <rect id="cell-Ile-de-France" x="250" y="140" width="140" height="60" rx="10" fill="#444"/>
  <rect id="cell-Provence" x="460" y="250" width="120" height="60" rx="10" fill="#444"/>
  <text x="100" y="175" fill="#fff" font-size="15" text-anchor="middle">Bretagne</text>
  <text x="320" y="55" fill="#fff" font-size="15" text-anchor="middle">Hauts-de-France</text>
  <text x="320" y="175" fill="#fff" font-size="15" text-anchor="middle">Coeur Paris</text>
  <text x="520" y="285" fill="#fff" font-size="15" text-anchor="middle">Provence</text>
  <text id="cell-txt-REN-PAR" x="220" y="155" fill="#fff" font-size="14" text-anchor="middle">REN-PAR</text>
  <text id="cell-txt-LIL-PAR" x="380" y="120" fill="#fff" font-size="14" text-anchor="middle">LIL-PAR</text>
  <text id="cell-txt-MRS-PAR" x="460" y="215" fill="#fff" font-size="14" text-anchor="middle">MRS-PAR</text>
</svg>
